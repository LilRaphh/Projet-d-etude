# =============================================================
#  docker-compose.yml — Wardrobe app + ngrok
#
#  Prérequis : Ollama doit tourner sur le Mac (app menu-bar ou `ollama serve`)
#
#  Démarrer : docker compose up -d
#  Arrêter  : docker compose down
#  Logs app : docker compose logs -f app
#  URL ngrok: docker compose logs -f ngrok
#
#  App      → http://localhost:5001
#  Monitoring (optionnel) : docker compose -f docker-compose.monitoring.yml up -d
# =============================================================

services:

  app:
    build: .
    container_name: wardrobe_app
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file: .env
    environment:
      # Ollama tourne nativement sur le Mac — accessible via host.docker.internal
      OLLAMA_URL: http://host.docker.internal:11434
      HF_HOME: /app/data/hf_cache
      DATABASE_URL: sqlite:////app/data/wardrobe.db
      VISION_MODEL: qwen2.5vl:7b
      TEXT_MODEL: qwen2.5vl:7b
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./data:/app/data
      - ./logs:/app/logs
      - ./templates:/app/templates
      - ./routes:/app/routes
      - ./ai:/app/ai
      - ./utils:/app/utils
      - ./config.py:/app/config.py
      - ./models.py:/app/models.py
      - ./extensions.py:/app/extensions.py
      - ./app.py:/app/app.py
      - ./pipeline/output:/app/pipeline/output
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - smartwear

  ngrok:
    image: ngrok/ngrok:latest
    container_name: wardrobe_ngrok
    restart: on-failure:3
    stop_grace_period: 15s
    command: http app:5001 --log=stdout
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - app
    networks:
      - smartwear

networks:
  smartwear:
    name: smartwear
    driver: bridge
