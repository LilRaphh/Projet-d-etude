# =============================================================
#  docker-compose.yml — Wardrobe app + Ollama + ngrok
#
#  Démarrer : docker compose up -d
#  Arrêter  : docker compose down
#  Logs     : docker compose logs -f app
#  URL ngrok: docker compose logs -f ngrok
#
#  App → http://localhost:5001
# =============================================================

services:

  app:
    build: .
    container_name: wardrobe_app
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
      HF_HOME: /app/data/hf_cache
      DATABASE_URL: sqlite:////app/data/wardrobe.db
      VISION_MODEL: llava:7b
      TEXT_MODEL: llava:7b
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ollama:
    image: ollama/ollama:latest
    container_name: wardrobe_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ngrok:
    image: ngrok/ngrok:latest
    container_name: wardrobe_ngrok
    restart: unless-stopped
    command: http app:5001 --log=stdout
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - app

volumes:
  ollama_data:
